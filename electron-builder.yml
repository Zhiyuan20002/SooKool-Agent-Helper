appId: com.sookool.agenthelper
productName: SooKool Agent Helper

publish:
  provider: github
  owner: Zhiyuan20002
  repo: SooKool-Agent-Helper
  releaseType: release

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

electronLanguages:
  - en
  - zh_CN
  - zh-HK
  - ja
  - fr
  - ko
  - es
  - pt_BR
  - ar

mac:
  icon: icon.icns
  category: public.app-category.developer-tools
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extendInfo:
    CFBundleDisplayName: SooKool 智能体助手
    CFBundleDevelopmentRegion: zh-Hans
    CFBundleLocalizations:
      - en
      - zh-Hans
      - zh-HK
      - ja
      - fr
      - ko
      - es
      - pt-BR
      - ar

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

linux:
  icon: icon.png

extraResources:
  - from: resources/sookool-app-icon.png
    to: sookool-app-icon.png
  - from: resources/sookool-app-icon-dark.png
    to: sookool-app-icon-dark.png
  - from: resources/sookool-app-icon.ico
    to: sookool-app-icon.ico
  - from: build/en.lproj
    to: en.lproj
  - from: build/zh-Hans.lproj
    to: zh-Hans.lproj
  - from: build/zh-HK.lproj
    to: zh-HK.lproj
  - from: build/ja.lproj
    to: ja.lproj
  - from: build/fr.lproj
    to: fr.lproj
  - from: build/ko.lproj
    to: ko.lproj
  - from: build/es.lproj
    to: es.lproj
  - from: build/pt-BR.lproj
    to: pt-BR.lproj
  - from: build/ar.lproj
    to: ar.lproj
